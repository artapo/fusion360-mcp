name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Fusion is not installed on CI, so the bridge is unreachable. The test
      # is written to pass either way: it asserts the protocol either answers
      # or reports "Cannot reach Fusion", which is exactly the offline path.
      - name: Protocol test
        run: python test_mcp_server.py

      - name: Package builds and installs
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install dist/*.whl
          fusion360-mcp --help
        shell: bash
