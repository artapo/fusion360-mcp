[project]
name = "fusion360-mcp"
version = "0.1.0"
description = "MCP bridge that lets Claude Code drive Fusion 360 — run Python in the live session"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "artapo" }]
keywords = ["fusion360", "mcp", "claude", "cad", "autodesk"]
classifiers = [
    "Environment :: Plugins",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
# No runtime deps on purpose: the server speaks JSON-RPC with stdlib only, and
# the installer just copies files. Nothing to resolve, nothing to break.
dependencies = []

[project.urls]
Homepage = "https://github.com/artapo/fusion360-mcp"
Issues = "https://github.com/artapo/fusion360-mcp/issues"

[project.scripts]
fusion360-mcp = "fusion360_mcp.install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# addin/ and skill/ live inside the package dir, so they ship with it --
# no force-include needed, and adding one duplicates every file.
packages = ["src/fusion360_mcp"]
